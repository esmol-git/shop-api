name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: migrate · build · unit · e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop_local_password
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shop -d shop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    env:
      DATABASE_URL: postgresql://shop:shop_local_password@127.0.0.1:5432/shop_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create shop_test database
        env:
          DATABASE_ADMIN_URL: postgresql://shop:shop_local_password@127.0.0.1:5432/shop
        run: node scripts/ensure-shop-test-db.mjs

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
